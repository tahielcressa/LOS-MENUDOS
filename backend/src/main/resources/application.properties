spring.application.name=minera-mvp
server.port=8080

# ---- Base de datos H2 en archivo (persistente entre reinicios) ----
spring.datasource.url=jdbc:h2:file:./db/minera;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---- Subida de archivos ----
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# ---- Almacenamiento de salidas y datos de ejemplo ----
app.storage.output=./outputs
app.storage.samples=../sample-data

# ---- Correo. Dejalo en false para probar local (solo muestra el correo en consola).
#      Para activarlo completa los datos del SMTP y pon enabled=true ----
app.mail.enabled=false
app.mail.from=sistema@minera.mvp
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_CONTRASENA_APP
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---- JWT ----
app.jwt.secret=c29tZS1sb25nLW11c3QtYmUtMzItYnl0ZXMtc2VjcmV0LWtleS1mb3ItaHNhbTI1Ni1taW5lcmE=
# base64 de una clave de 48 bytes
app.jwt.expiration-hours=24