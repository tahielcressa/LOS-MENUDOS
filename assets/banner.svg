<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#3b82c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="900" height="300" fill="url(#sky)"/>

  <!-- Estrellas -->
  <g fill="#e2e8f0">
    <animateTransform attributeName="transform" type="rotate" from="0 450 150" to="360 450 150" dur="80s" repeatCount="indefinite"/>
    <circle cx="80" cy="40" r="1.5"/><circle cx="180" cy="70" r="1"/><circle cx="300" cy="30" r="1.5"/>
    <circle cx="420" cy="55" r="1"/><circle cx="560" cy="35" r="1.5"/><circle cx="700" cy="60" r="1"/>
    <circle cx="820" cy="40" r="1.5"/><circle cx="140" cy="110" r="1"/><circle cx="650" cy="95" r="1"/>
  </g>

  <!-- Montañas de fondo -->
  <g fill="#16233c" opacity="0.85">
    <polygon points="0,190 130,90 260,190"/>
    <polygon points="180,190 340,60 500,190"/>
    <polygon points="420,190 600,100 780,190"/>
    <polygon points="700,190 840,120 900,190"/>
  </g>
  <g fill="#1d2b47" opacity="0.9">
    <polygon points="0,200 120,120 240,200"/>
    <polygon points="200,200 380,80 560,200"/>
    <polygon points="500,200 680,130 860,200"/>
  </g>

  <!-- Suelo -->
  <rect y="200" width="900" height="100" fill="#1a1c23"/>

  <!-- Rieles -->
  <rect x="0" y="236" width="900" height="3" fill="#475569"/>
  <rect x="0" y="246" width="900" height="3" fill="#475569"/>
  <g stroke="#64748b" stroke-width="2">
    <line x1="0" y1="236" x2="900" y2="236"/>
    <line x1="0" y1="246" x2="900" y2="246"/>
  </g>

  <!-- Durmientes animados -->
  <g stroke="#334155" stroke-width="5">
    <line x1="90" y1="233" x2="90" y2="250"><animate attributeName="x1" from="0" to="900" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" from="0" to="900" dur="9s" repeatCount="indefinite"/></line>
    <line x1="180" y1="233" x2="180" y2="250"><animate attributeName="x1" from="0" to="900" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" from="0" to="900" dur="9s" repeatCount="indefinite"/></line>
    <line x1="270" y1="233" x2="270" y2="250"><animate attributeName="x1" from="0" to="900" dur="9s" repeatCount="indefinite"/><animate attributeName="x2" from="0" to="900" dur="9s" repeatCount="indefinite"/></line>
  </g>

  <!-- Vagoneta de mina -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-150 0; 950 0" dur="14s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -3; 0 0" dur="0.45s" repeatCount="indefinite"/>
      <polygon points="0,210 18,200 120,200 138,210 138,215 0,215" fill="url(#steel)"/>
      <polygon points="18,200 44,176 120,176 120,200" fill="#334155"/>
      <polygon points="0,215 138,215 138,222 0,222" fill="#1f2937"/>
      <!-- Mena dorada dentro -->
      <rect x="48" y="151" width="64" height="25" rx="4" fill="url(#gold)"/>
      <polygon points="60,176 68,160 76,176" fill="url(#gold)"/>
      <polygon points="88,176 96,162 104,176" fill="url(#gold)"/>
      <rect x="52" y="186" width="52" height="4" fill="#b45309"/>
      <circle cx="34" cy="218" r="6" fill="#0b0f17"/><circle cx="106" cy="218" r="6" fill="#0b0f17"/>
      <circle cx="34" cy="218" r="3" fill="#475569"/><circle cx="106" cy="218" r="3" fill="#475569"/>
    </g>
  </g>

  <!-- Picos de minero (se mecen) -->
  <g transform="translate(700,120)">
    <animateTransform attributeName="transform" type="rotate" values="-12 700 120; 12 700 120; -12 700 120" dur="2.2s" repeatCount="indefinite"/>
    <g transform="translate(700,120)">
      <rect x="-4" y="0" width="8" height="70" rx="3" fill="#7c2d12"/>
      <path d="M -30,10 A 30 30 0 0 1 30,10 L 24,16 L -24,16 Z" fill="url(#steel)"/>
    </g>
  </g>

  <!-- Destellos alrededor del título -->
  <g>
    <circle cx="410" cy="130" r="14" fill="url(#glow)"><animate attributeName="r" values="10;18;10" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="96" r="10" fill="url(#glow)"><animate attributeName="r" values="7;14;7" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="150" r="9" fill="url(#glow)"><animate attributeName="r" values="6;12;6" dur="1.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Título principal -->
  <text x="450" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#gold)" dominant-baseline="middle">
    <animate attributeName="letter-spacing" values="2px;10px;2px" dur="4s" repeatCount="indefinite"/>
    ROCK<span fill="#e2e8f0"><animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite">LOGIC</animate></span>
    <animate attributeName="fill" values="#f59e0b;#fde68a;#f59e0b" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Línea dorada bajo el título -->
  <rect x="360" y="148" width="180" height="4" rx="2" fill="#f59e0b">
    <animate attributeName="width" values="0;180;0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <text x="450" y="176" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#cbd5e1" font-weight="500">
    Gestión inteligente de operaciones mineras · MVP
  </text>
</svg>